name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}', extensions: pdo_sqlite, intl, mbstring, curl }
      - run: find app config database public -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/run.php
