name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: E2E smoke (embedded PGlite + demo data)
        run: |
          npx playwright install --with-deps chromium
          SESSION_SECRET=ci-secret-ci-secret-ci-secret-1234 npm start &
          npx wait-on http://localhost:3000/api/health
          npm run e2e
      - name: E2E full platform (fresh data; portal, conditions, admin, integrations, APIs)
        run: |
          pkill -f "node server.js" || true
          rm -rf data
          SESSION_SECRET=ci-secret-ci-secret-ci-secret-1234 CRON_SECRET=e2e-cron VINX_WEBHOOK_SECRET=e2e-hook STRIPE_WEBHOOK_SECRET=whsec_e2e ORDER_WEBHOOK_URL=http://127.0.0.1:4555/hook ORDER_WEBHOOK_SECRET=e2e npm start &
          npx wait-on http://localhost:3000/api/health
          npm run e2e:platform
