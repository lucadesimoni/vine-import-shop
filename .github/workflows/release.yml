name: Release
# Tag a version (git tag v1.2.0 && git push --tags) → ready-to-run archive + Docker image.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run changelog:check   # tag must equal package.json version and have a CHANGELOG section
      - run: npm run release
      - run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md
      - name: Publish archive
        uses: softprops/action-gh-release@v2
        with: { files: "release/shop-*.tar.gz", body_path: release-notes.md, name: "${{ github.ref_name }}" }
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
