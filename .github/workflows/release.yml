name: Release
# Versioning follows main automatically:
#   npm run version:bump -- minor   (moves CHANGELOG [Unreleased] → [x.y.z], bumps package.json)
#   merge / push to main            → this workflow tags vX.Y.Z (if not tagged yet), publishes the GitHub release
#                                     with the CHANGELOG section, the ready-to-run archive and the Docker image.
# Pushing a tag vX.Y.Z by hand works too.
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: write
  packages: write
concurrency: { group: release, cancel-in-progress: false }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Version to release
        id: v
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "$VERSION" ] || { echo "::error::tag ${GITHUB_REF_NAME} ≠ package.json $VERSION"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "$VERSION already released — nothing to do"; echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.release == 'true'
        with: { node-version: 22, cache: npm }
      - if: steps.v.outputs.release == 'true'
        run: npm ci
      - if: steps.v.outputs.release == 'true'
        run: npm test
      - if: steps.v.outputs.release == 'true'
        run: npm run changelog:check   # package.json version must have a CHANGELOG section
      - name: Tag the version
        if: steps.v.outputs.release == 'true' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.v.outputs.tag }}" -m "${{ steps.v.outputs.tag }}"
          git push origin "${{ steps.v.outputs.tag }}"
      - if: steps.v.outputs.release == 'true'
        run: npm run release
      - if: steps.v.outputs.release == 'true'
        run: node scripts/release-notes.mjs "${{ steps.v.outputs.tag }}" > release-notes.md
      - name: Publish release
        if: steps.v.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with: { tag_name: "${{ steps.v.outputs.tag }}", files: "release/shop-*.tar.gz", body_path: release-notes.md, name: "${{ steps.v.outputs.tag }}" }
      - uses: docker/login-action@v3
        if: steps.v.outputs.release == 'true'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        if: steps.v.outputs.release == 'true'
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
