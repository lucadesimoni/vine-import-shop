# The simplest way to run the shop: one container, database built in, everything in one volume.
#   docker compose up -d    → http://localhost:3000   (admin: /admin · admin@example.com / admin-demo-1234)
# Secrets are generated on first start and stored in the volume — no configuration needed.
services:
  shop:
    build: .
    ports: ["3000:3000"]
    volumes: [shop-data:/app/data]
    restart: unless-stopped
    # Optional settings (mail, payments, vinX …): create a .env file (see .env.example) and uncomment:
    # env_file: .env
volumes:
  shop-data:
