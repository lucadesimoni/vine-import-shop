# Production-like stack: app + Postgres + scheduler.  docker compose up -d → http://localhost:3000
services:
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://shop:shop@db:5432/shop
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: shop, POSTGRES_PASSWORD: shop, POSTGRES_DB: shop }
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U shop"], interval: 5s, retries: 10 }
    restart: unless-stopped
  cron:
    image: curlimages/curl:8.11.1
    env_file: .env
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 600; curl -fsS -X POST -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron || true; done"]
    depends_on: [app]
    restart: unless-stopped
volumes:
  pg:
