# Local or single-server setup: docker compose up -d → http://localhost:8080
services:
  shop:
    build: .
    ports: ["8080:80"]
    env_file: .env
    environment:
      DB_DRIVER: mysql
      DB_HOST: db
      DB_NAME: shop
      DB_USER: shop
      DB_PASS: shop
    volumes:
      - storage:/var/www/html/storage
    depends_on: [db]
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: shop
      MARIADB_USER: shop
      MARIADB_PASSWORD: shop
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
  cron:
    build: .
    command: sh -c 'while true; do php bin/console vinx:sync; sleep 600; done'
    env_file: .env
    environment: { DB_DRIVER: mysql, DB_HOST: db, DB_NAME: shop, DB_USER: shop, DB_PASS: shop }
    volumes: [storage:/var/www/html/storage]
    depends_on: [db]
volumes:
  storage:
  db:
