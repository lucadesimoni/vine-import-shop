# App + separate PostgreSQL (for larger setups / several app instances):
#   docker compose -f docker-compose.postgres.yml up -d   → http://localhost:3000
# The app's built-in scheduler runs ERP sync + outbox (JOBS_INTERVAL_MINUTES, default 10).
services:
  app:
    build: .
    ports: ["3000:3000"]
    # env_file: .env          # optional settings (mail, payments, vinX …)
    environment:
      DATABASE_URL: postgres://shop:shop@db:5432/shop
    volumes: [uploads:/app/data]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: shop, POSTGRES_PASSWORD: shop, POSTGRES_DB: shop }
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U shop"], interval: 5s, retries: 10 }
    restart: unless-stopped
volumes:
  pg:
  uploads:
