; Hostpoint Managed Flex Server (M+) — Custom Service Control (supervisord)
; 1) hpservices supervisord start            (once)
; 2) hpservices supervisord add shop          → creates ~/.services/supervisord/shop/service.conf
; 3) replace that file with this one, then:   supervisorctl update
; Website in Control Panel: «Nginx Custom Mode (Proxy auf eigene Applikation)», backend port 8080.
[program:shop]
command=/usr/local/bin/node %(ENV_HOME)s/app/shop/server.js
directory=%(ENV_HOME)s/app/shop/
environment=NODE_ENV="production",HOST="127.0.0.1",PORT="8080"
autostart=true
autorestart=true
stopwaitsecs=15
stdout_logfile=%(ENV_HOME)s/.services/supervisord/shop/log/default.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=10
stderr_logfile=%(ENV_HOME)s/.services/supervisord/shop/log/default.err
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=10
